# fly.toml app configuration file generated for myclick on 2026-11-10T15:43:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'myclick'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
